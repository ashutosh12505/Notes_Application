# Render Blueprint - Optional configuration file
# This makes it easier to deploy multiple services at once
# You can import this in Render dashboard or use Render CLI

services:
  # PostgreSQL Database
  - type: pg
    name: notes-db
    plan: free
    databaseName: notes_db
    databaseUser: notes_user

  # Django Backend
  - type: web
    name: notes-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: notes-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: notes-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: True

  # React Frontend (Static Site)
  - type: web
    name: notes-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://notes-backend.onrender.com